apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: nginx-test
  namespace: nginx
  annotations:
    kargo.akuity.io/argocd-context: '[{"name":"nginx-test","namespace":"argocd"}]'
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: nginx
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: nginx-test
                namespace: argocd
                sources:
                  - repoURL: https://github.com/jiachengxu/mcp-test-repo
                    kustomize:
                      images:
                        - repoURL: polinux/stress
                          tag: '${{ imageFrom("polinux/stress").Tag }}'
