apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-staging
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: nginx:nginx-staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nginx
  source:
    repoURL: https://github.com/jiachengxu/mcp-test-repo
    targetRevision: HEAD
    path: apps/nginx/overlays/staging
  destination:
    name: nginx-cluster
    namespace: nginx-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
