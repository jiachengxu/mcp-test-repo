apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nginx
  namespace: argocd
spec:
  description: "nginx deployments managed by Kargo"
  sourceRepos:
    - https://github.com/jiachengxu/mcp-test-repo.git
  destinations:
    - name: nginx-cluster
      namespace: nginx-test
    - name: nginx-cluster
      namespace: nginx-staging
    - name: nginx-cluster
      namespace: nginx-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
