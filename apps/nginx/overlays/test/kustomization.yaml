apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nginx-test
commonLabels:
  app.kubernetes.io/instance: nginx-test
  env: test
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: nginx
images:
  - name: mirror.gcr.io/library/nginx
    newTag: 1.27.0
