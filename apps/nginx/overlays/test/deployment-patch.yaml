apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "256M", "--vm-hang", "1"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 20m
              # Bumped 220Mi -> 270Mi: OOM remediation for incident 2qkpci4dqww0vvwj
              # (polinux/stress --vm-bytes 256M exceeded the prior 220Mi limit).
              memory: 270Mi
